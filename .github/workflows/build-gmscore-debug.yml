name: Build GmsCore APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        env:
          GRADLE_MICROG_VERSION_WITHOUT_GIT: '1'
        run: |
          chmod +x gradlew
          ./gradlew :play-services-core:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GmsCore-0.3.17.252432-debug
          path: play-services-core/build/outputs/apk/**/*.apk
          if-no-files-found: error
